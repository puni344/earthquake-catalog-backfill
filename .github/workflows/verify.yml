name: Verify catalog recovery
on:
  push:
    paths: ['earthquake/**', 'Makefile', 'Dockerfile', '.dockerignore', '.github/workflows/verify.yml']
  pull_request:
    paths: ['earthquake/**', 'Makefile', 'Dockerfile', '.dockerignore', '.github/workflows/verify.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    if: github.event.repository.visibility == 'public'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - run: make verify
  container:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: docker build -t d2-verify .
      - run: docker run --rm --network none d2-verify
