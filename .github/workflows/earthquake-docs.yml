name: D2 documentation
on:
  push:
    paths: ['docs/**', 'README.md', 'Makefile', 'earthquake/scripts/*docs.py', '.github/workflows/earthquake-docs.yml']
  pull_request:
    paths: ['docs/**', 'README.md', 'Makefile', 'earthquake/scripts/*docs.py', '.github/workflows/earthquake-docs.yml']
permissions:
  contents: read
jobs:
  docs:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.11'
      - run: make docs-check
      - run: make docs-test
