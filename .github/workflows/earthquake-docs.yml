name: D2 documentation
on:
  push:
    paths: ['docs/**', 'README.md', 'Makefile', 'earthquake/scripts/*docs.py', 'earthquake/scripts/check_evidence.py', 'earthquake/test_evidence.py', '.github/workflows/earthquake-docs.yml']
  pull_request:
    paths: ['docs/**', 'README.md', 'Makefile', 'earthquake/scripts/*docs.py', 'earthquake/scripts/check_evidence.py', 'earthquake/test_evidence.py', '.github/workflows/earthquake-docs.yml']
permissions:
  contents: read
jobs:
  docs:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10.11'
      - run: make docs-check
      - run: make docs-test
      - run: make evidence-check
      - run: python -m unittest earthquake.test_evidence
